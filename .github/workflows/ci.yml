name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  security-and-lint:
    name: Lint, SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit

      - name: Run Flake8 (Syntax & Style Check)
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Bandit (Static Application Security Testing)
        run: |
          bandit -r services/ -ll -ii

      - name: Run pip-audit (CVE Dependency Scanner)
        run: |
          pip-audit -r services/payment-api/requirements.txt
          pip-audit -r services/ledger/requirements.txt
          pip-audit -r services/notification/requirements.txt

  build-scan-and-push:
    name: Docker Build, Trivy Gate & AWS ECR Push
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Build and Scan payment-api
      - name: Build payment-api Image
        run: |
          docker build -t payment-api:${{ github.sha }} services/payment-api

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'payment-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 2. Push All 3 Services to AWS ECR
      - name: Tag and Push Images to Amazon ECR
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Push payment-api
          docker tag payment-api:${{ github.sha }} $REGISTRY/payment-platform/payment-api:v1.0.0
          docker push $REGISTRY/payment-platform/payment-api:v1.0.0

          # Build and push ledger
          docker build -t $REGISTRY/payment-platform/ledger:v1.0.0 services/ledger
          docker push $REGISTRY/payment-platform/ledger:v1.0.0

          # Build and push notification
          docker build -t $REGISTRY/payment-platform/notification:v1.0.0 services/notification
          docker push $REGISTRY/payment-platform/notification:v1.0.0