global:
  namespace: payments

postgres:
  enabled: true
  image: postgres:15-alpine
  dbName: ledger_db
  username: postgres
  password: postgres
  port: 5432
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

ledger:
  replicaCount: 2
  image:
    repository: ledger
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8001
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

notification:
  replicaCount: 1
  image:
    repository: notification
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8002
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  
paymentApi:
  replicaCount: 2
  image:
    repository: payment-api
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  simulateFailure: true
  resources:
    request: 
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

ingress:
  enabled: true
  className: "nginx"
  host: localhost