global:
  namespace: payments

postgres:
  enabled: true
  image: postgres:15-alpine
  dbName: ledger_db
  user: postgres
  password: postgrespassword
  port: 5432
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

ledger:
  replicaCount: 2
  image:
    repository: 296191651992.dkr.ecr.ap-south-1.amazonaws.com/payment-platform/ledger
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8001
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

notification:
  replicaCount: 2
  image:
    repository: 296191651992.dkr.ecr.ap-south-1.amazonaws.com/payment-platform/notification
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8002
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

paymentApi:
  replicaCount: 4
  image:
    repository: 296191651992.dkr.ecr.ap-south-1.amazonaws.com/payment-platform/payment-api
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  simulateFailure: false
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

ingress:
  enabled: true
  className: alb # AWS Load Balancer Controller
  host: ""