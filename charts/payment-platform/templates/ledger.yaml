apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ledger
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ledger.port }}
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: ledger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ledger
spec:
  replicas: {{ .Values.ledger.replicaCount }}
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
        version: {{ .Values.ledger.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ledger
          image: "{{ .Values.ledger.image.repository }}:{{ .Values.ledger.image.tag }}"
          imagePullPolicy: {{ .Values.ledger.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            {{- toYaml .Values.ledger.resources | nindent 14 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5