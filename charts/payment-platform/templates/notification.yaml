apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: {{ .Values.global.namespace }}
  labels:
    app: notification
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.notification.port }}
      targetPort: 8002
      protocol: TCP
      name: http
  selector:
    app: notification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: {{ .Values.global.namespace }}
  labels:
    app: notification
spec:
  replicas: {{ .Values.notification.replicaCount }}
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
        version: {{ .Values.notification.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: notification
          image: "{{ .Values.notification.image.repository }}:{{ .Values.notification.image.tag }}"
          imagePullPolicy: {{ .Values.notification.image.pullPolicy }}
          ports:
            - containerPort: 8002
          resources:
            {{- toYaml .Values.notification.resources | nindent 14 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5