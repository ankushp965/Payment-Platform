apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment-api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.paymentApi.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: payment-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment-api
spec:
  replicas: {{ .Values.paymentApi.replicaCount }}
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        version: {{ .Values.paymentApi.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: payment-api
          image: "{{ .Values.paymentApi.image.repository }}:{{ .Values.paymentApi.image.tag }}"
          imagePullPolicy: {{ .Values.paymentApi.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: LEDGER_URL
              value: "http://ledger:{{ .Values.ledger.port }}"
            - name: NOTIFICATION_URL
              value: "http://notification:{{ .Values.notification.port }}"
            - name: SIMULATE_FAILURE
              value: {{ .Values.paymentApi.simulateFailure | quote }}
          resources:
            {{- toYaml .Values.paymentApi.resources | nindent 14 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5