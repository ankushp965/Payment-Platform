apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment-api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.paymentApi.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: payment-api
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: payment-api
spec:
  replicas: 4 
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: payment-api
  strategy:
    canary:
      analysis:
        templates:
          - templateName: payment-success-rate
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: payment-api
        version: {{ .Values.paymentApi.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: payment-api
          image: "{{ .Values.paymentApi.image.repository }}:{{ .Values.paymentApi.image.tag }}"
          imagePullPolicy: {{ .Values.paymentApi.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: LEDGER_URL
              value: "http://ledger:{{ .Values.ledger.port }}"
            - name: NOTIFICATION_URL
              value: "http://notification:{{ .Values.notification.port }}"
            - name: SIMULATE_FAILURE
              value: {{ .Values.paymentApi.simulateFailure | quote }}
          resources:
            {{- toYaml .Values.paymentApi.resources | nindent 14 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5